<figure class="chain-drawing" aria-labelledby="drawing-caption">
  <div class="drawing-sheet">
    <svg viewBox="55 0 380 570" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.2" role="img" aria-labelledby="chain-svg-title chain-svg-desc">
      <title id="chain-svg-title">The full-stack chain, an exploded view</title>
      <desc id="chain-svg-desc">Five isometric plates, read from the bottom up: hardware, network, software, product and harness.</desc>
      <path class="axis" d="M237 8v551M64 520h354"/>
      {% for layer in about.layers %}
      <g transform="translate(0 {{ loop.index0 * 104 }})">
        <path class="plate" d="m82 79 139-58 169 57-139 60Z"/>
      <path d="m82 79 0 10 169 59 139-60V78M251 138v10"/>
      <path class="fine" d="m96 79 125-51 155 50-125 54Z"/>
      <path class="callout-line" d="M348 96h54"/>
      {% if layer.id == "harness" %}
      <path class="signal" d="m155 80 44-18 56 19-44 18Zm56 19v10m44-28 53-22 34 12-53 22-34-12m-44 18 34 12 44-18m-90-31-35-12 53-22 35 12-53 22m53-22 56 19"/>
      <circle cx="155" cy="80" r="3"/><circle cx="308" cy="59" r="3"/><circle cx="255" cy="111" r="3"/>
      {% elif layer.id == "product" %}
      <path d="m160 62 57-23 42 14-57 24Zm42 15v12l57-24V53m-99 9v12l42 15m48 7 57-24 35 12-57 24Zm0 0v11l35 12 57-24V84m-57 24v11"/>
      <path class="signal" d="m212 98 19 7 22-9m-41 2-19 8 19 7 19-8"/>
      {% elif layer.id == "software" %}
      <path d="m158 68 26-11 37 13-26 11Zm0 0v20l37 13 26-11V70m-26 11v20m61-42 26-11 37 13-26 11Zm0 0v20l37 13 26-11V61m-26 11v20m-61 8 26-11 37 13-26 11Zm0 0v20l37 13 26-11v-20m-26 11v20"/>
      <path class="signal" d="m221 81 24-10 11 4m37 8 23 8-38 16"/>
      {% elif layer.id == "network" %}
      <path class="signal" d="m150 79 32-13 69 23 62-26m-62 26 34 11-28 12m-75-46 38-16"/>
      <path d="m137 79 13-6 14 5-14 6Zm70-29 13-6 14 5-14 6Zm93 13 13-6 14 5-14 6Zm-56 49 13-6 14 5-14 6Z"/>
      <path d="m173 93 28 10m-18-14 28 10m-18-14 28 10"/>
      {% else %}
      <path d="m171 72 54-22 66 22-54 23Zm0 0v10l66 23 54-23V72m-54 23v10"/>
      <path class="signal" d="m188 72 37-15 48 15-37 15Z"/>
      <path d="m156 62 8 3m3-8 8 3m3-8 8 3m3-8 8 3m3-8 8 3m50 58 8 3m3-8 8 3m3-8 8 3m3-8 8 3m3-8 8 3m-112 13-8 3m-3-8-8 3m-3-8-8 3m-3-8-8 3m104-42 8-3m3 8 8-3m3 8 8-3m3 8 8-3"/>
      {% endif %}
      <circle cx="112" cy="79" r="2.5"/><circle cx="252" cy="126" r="2.5"/>

        <circle class="callout" cx="414" cy="96" r="13"/>
        <text class="callout-number" x="414" y="100" text-anchor="middle" stroke="none" fill="currentColor">{{ layer.number }}</text>
      </g>
      {% endfor %}
    </svg>
    <ol class="layer-legend" reversed>
      {% for layer in about.layers %}
      <li><span class="legend-number">{{ layer.number }}</span><span>{{ layer.name }}</span></li>
      {% endfor %}
    </ol>
  </div>
  <figcaption id="drawing-caption"><span>A–A / Exploded view</span><span>Read from the hardware up</span></figcaption>
</figure>
