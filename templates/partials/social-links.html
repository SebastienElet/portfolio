{% set social_resume = load_data(path="resume.json") %}
{% if social_resume.basics.profiles %}
<ul class="social-links">
  {% for profile in social_resume.basics.profiles %}
  {% if profile.network and profile.url %}
  <li><a href="{{ profile.url }}" aria-label="{{ profile.network }} profile" rel="me noopener">{{ profile.network }}</a></li>
  {% endif %}
  {% endfor %}
</ul>
{% endif %}
